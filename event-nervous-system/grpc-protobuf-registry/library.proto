// Kontrak komunikasi biner lintas seluruh bahasa. Bahasa: Protocol Buffers.
syntax = "proto3";

package perpus.v1;

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 stock_available = 4;
  int32 ebook_copies = 5;
}

message GetBookRequest {
  string id = 1;
}

service Catalog {
  rpc GetBook(GetBookRequest) returns (Book);
}
